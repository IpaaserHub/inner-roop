name: auto-loop

on:
  workflow_dispatch:
    inputs:
      ticks:
        description: How many ticks to advance
        required: false
        default: "12"
      scenario:
        description: support, eval, or fight
        required: false
        default: support
      mode:
        description: graph or single
        required: false
        default: graph
      anchored:
        description: "true keeps anchors. false cuts them."
        required: false
        default: "true"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Advance the graph
        run: >
          node --experimental-strip-types runner/auto.ts
          --ticks "${{ github.event.inputs.ticks || '12' }}"
          --scenario "${{ github.event.inputs.scenario || 'support' }}"
          --mode "${{ github.event.inputs.mode || 'graph' }}"
          --anchored "${{ github.event.inputs.anchored || 'true' }}"
      - name: Commit the loop state
        run: |
          git config user.name "inner-roop"
          git config user.email "inner-roop@users.noreply.github.com"
          git add work/STATUS.md work/STATE.json work/TRACE.jsonl
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "loop: advance grounded graph"
            git push
          fi
